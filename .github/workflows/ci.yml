name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1 avoids IPv6 localhost vs Postgres IPv4 mapping issues on Actions.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/crm_test?sslmode=disable
      JWT_SECRET: ci-test-secret-not-for-production-use-32chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install & test server
        working-directory: server
        run: |
          npm ci
          npx prisma migrate deploy
          npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d crm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/crm_e2e?sslmode=disable
      JWT_SECRET: ci-e2e-jwt-secret-at-least-32-characters-long
      VITE_GRAPHQL_URL: http://127.0.0.1:4000/graphql
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Install Playwright (root)
        run: npm ci

      - name: Write server/.env for seed & API
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" > server/.env
          echo "JWT_SECRET=${JWT_SECRET}" >> server/.env
          echo "CLIENT_ORIGIN=http://localhost:5173" >> server/.env

      - name: Migrate & seed
        working-directory: server
        run: npx prisma migrate deploy && npm run db:seed

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        run: npm run test:e2e
